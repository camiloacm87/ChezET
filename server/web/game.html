<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajedrez en Red</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" id="home" href="/">♞ Ajedrez en Red</a>
    <span class="spacer"></span>
    <span class="conn" id="conn">Conectando…</span>
  </div>

  <main class="game">
    <section class="board-wrap">
      <div class="player-bar" id="barTop"></div>
      <div class="board" id="board"></div>
      <div class="player-bar" id="barBottom"></div>
    </section>

    <aside class="side">
      <div class="panel status" id="status">Cargando…</div>
      <div class="buttons" id="buttons"></div>
      <div class="panel">
        <div class="title-sm">Jugadas</div>
        <div class="moves" id="moves"></div>
      </div>
      <div class="panel chat">
        <div class="title-sm">Chat</div>
        <div class="chat-log" id="chatLog"></div>
        <form id="chatForm" autocomplete="off">
          <input id="chatInput" maxlength="300" placeholder="Escribe un mensaje…">
          <button>Enviar</button>
        </form>
      </div>
    </aside>
  </main>

  <div class="overlay hidden" id="promo">
    <div class="dialog">
      <h3>Coronar peón</h3>
      <div class="promo-choices" id="promoChoices"></div>
      <div style="margin-top:14px"><button class="secondary" id="promoCancel">Cancelar</button></div>
    </div>
  </div>

  <script src="/chess.js"></script>
  <script src="/game.js"></script>
</body>
</html>
